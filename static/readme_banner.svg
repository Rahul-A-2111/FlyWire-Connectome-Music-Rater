<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="100%" height="250" style="background:#0a1020; border-radius:16px; overflow:hidden;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
    <linearGradient id="whiteGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#e2e8f0" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="filmBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <!-- Glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="900" height="250" fill="#070b14" />
  
  <!-- Subtle Grid Pattern in Blue -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="50" x2="900" y2="50" />
    <line x1="0" y1="100" x2="900" y2="100" />
    <line x1="0" y1="150" x2="900" y2="150" />
    <line x1="0" y1="200" x2="900" y2="200" />
    <line x1="150" y1="0" x2="150" y2="250" />
    <line x1="300" y1="0" x2="300" y2="250" />
    <line x1="450" y1="0" x2="450" y2="250" />
    <line x1="600" y1="0" x2="600" y2="250" />
    <line x1="750" y1="0" x2="750" y2="250" />
  </g>

  <!-- Vintage Film Frame Border (White, Blue, Red accents) -->
  <rect x="18" y="16" width="864" height="218" rx="12" fill="none" stroke="url(#filmBorder)" stroke-width="2.5" />
  <rect x="26" y="24" width="848" height="202" rx="8" fill="none" stroke="#2563eb" stroke-opacity="0.4" stroke-width="1" />

  <!-- Film Sprockets Top & Bottom (White & Blue) -->
  <g fill="#ffffff" opacity="0.6">
    <rect x="50" y="20" width="16" height="8" rx="2" />
    <rect x="110" y="20" width="16" height="8" rx="2" />
    <rect x="170" y="20" width="16" height="8" rx="2" />
    <rect x="710" y="20" width="16" height="8" rx="2" />
    <rect x="770" y="20" width="16" height="8" rx="2" />
    <rect x="830" y="20" width="16" height="8" rx="2" />

    <rect x="50" y="222" width="16" height="8" rx="2" />
    <rect x="110" y="222" width="16" height="8" rx="2" />
    <rect x="170" y="222" width="16" height="8" rx="2" />
    <rect x="710" y="222" width="16" height="8" rx="2" />
    <rect x="770" y="222" width="16" height="8" rx="2" />
    <rect x="830" y="222" width="16" height="8" rx="2" />
  </g>

  <!-- Left Accent Badge: Blue (Courtship / Auditory Circuit) -->
  <rect x="42" y="44" width="130" height="28" rx="14" fill="#1d4ed8" fill-opacity="0.25" stroke="#38bdf8" stroke-width="1.2" />
  <circle cx="58" cy="58" r="4" fill="#38bdf8" />
  <text x="70" y="62" font-family="'Courier New', Courier, monospace" font-size="11" font-weight="bold" fill="#38bdf8" letter-spacing="1">JOHNSTON'S JO-AB</text>

  <!-- Right Accent Badge: Red (Threat / Escape Circuit) -->
  <rect x="728" y="44" width="130" height="28" rx="14" fill="#dc2626" fill-opacity="0.25" stroke="#f87171" stroke-width="1.2" />
  <circle cx="744" cy="58" r="4" fill="#ef4444" />
  <text x="756" y="62" font-family="'Courier New', Courier, monospace" font-size="11" font-weight="bold" fill="#fca5a5" letter-spacing="1">LC4 ESCAPE HAZARD</text>

  <!-- Central Title: White Bold 1930s Typography -->
  <text x="450" y="96" text-anchor="middle" font-family="'Cinzel', Georgia, 'Times New Roman', serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="4" filter="url(#glow)">
    FLY-DELITY
  </text>
  <text x="450" y="96" text-anchor="middle" font-family="'Cinzel', Georgia, 'Times New Roman', serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="4">
    FLY-DELITY
  </text>

  <!-- Subtitle with Red and Blue Highlights -->
  <text x="450" y="128" text-anchor="middle" font-family="'Special Elite', 'Courier New', monospace" font-size="13" font-weight="700" fill="#f87171" letter-spacing="2">
    1930s RUBBER HOSE NOIR <tspan fill="#ffffff">★</tspan> <tspan fill="#38bdf8">DROSOPHILA CONNECTOME MUSIC RATER</tspan>
  </text>

  <!-- Synaptic Waveform / Circuit Display in Center -->
  <path d="M 180 162 Q 220 148 260 162 T 340 162 T 420 135 T 450 185 T 480 135 T 560 162 T 640 162 T 720 162" fill="none" stroke="url(#blueGrad)" stroke-width="2.5" />
  <path d="M 430 162 L 440 145 L 450 180 L 460 140 L 470 162" fill="none" stroke="url(#redGrad)" stroke-width="3" filter="url(#glow)" />

  <!-- Lower Descriptor Pills: White, Blue, Red -->
  <g font-family="'Courier New', monospace" font-size="10" font-weight="bold" letter-spacing="1" text-anchor="middle">
    <!-- Pill 1: White -->
    <rect x="180" y="186" width="160" height="24" rx="12" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-width="1" />
    <text x="260" y="202" fill="#ffffff">139,255 SYNAPSES</text>

    <!-- Pill 2: Blue -->
    <rect x="365" y="186" width="170" height="24" rx="12" fill="#2563eb" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1" />
    <text x="450" y="202" fill="#93c5fd">LIF NEURAL SIMULATOR</text>

    <!-- Pill 3: Red -->
    <rect x="560" y="186" width="160" height="24" rx="12" fill="#dc2626" fill-opacity="0.2" stroke="#ef4444" stroke-width="1" />
    <text x="640" y="202" fill="#fca5a5">REAL-TIME DISPATCH</text>
  </g>
</svg>
